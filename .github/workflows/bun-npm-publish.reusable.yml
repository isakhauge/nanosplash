# .github/workflows/reusables/bun-npm-publish.yml
name: Reusable - Bun NPM Publish (Trusted Publisher)

on:
  workflow_call:
    inputs:
      working-directory:
        description: "Directory of the package"
        required: false
        type: string
        default: "."
      npm-tag:
        description: "npm dist-tag to publish with"
        required: false
        type: string
        default: "latest"

jobs:
  publish:
    runs-on: ubuntu-latest

    # Required for npm Trusted Publishing (OIDC)
    permissions:
      id-token: write
      contents: read

    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Use Bun for install & build
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build package
        run: bun run build

      # Use Node + latest npm for the publish itself
      - name: Setup Node for publish
        uses: actions/setup-node@v4
        with:
          node-version: '24'              # >= 22.14.0 as required
          registry-url: 'https://registry.npmjs.org'

      - name: Upgrade npm (ensure >= 11.5.1)
        run: npm install -g npm@latest

      # IMPORTANT:
      # - Do NOT set NPM_TOKEN or NODE_AUTH_TOKEN
      # - Do NOT call npm config set ...:_authToken
      - name: Publish to npm via Trusted Publisher
        run: npm publish --provenance --access public --tag ${{ inputs.npm-tag }}