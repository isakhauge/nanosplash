name: Reusable - Bun NPM Publish (Trusted Publisher)

on:
  workflow_call:
    inputs:
      working-directory:
        description: "Directory of the package"
        required: false
        type: string
        default: "."
      npm-tag:
        description: "npm dist-tag to publish with"
        required: false
        type: string
        default: "latest"

jobs:
  publish:
    runs-on: ubuntu-latest

    # Required for npm Trusted Publishing (OIDC)
    permissions:
      id-token: write
      contents: read

    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 1) Use Bun for install & build
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build package
        run: bun run build

      # 2) Use Node 24 + newest npm *just* for publish
      - name: Setup Node for publish
        uses: actions/setup-node@v4
        with:
          node-version: "24.x"
          registry-url: "https://registry.npmjs.org"

      - name: Check Node & npm versions
        run: |
          node -v
          npm -v

      - name: Upgrade npm (ensure >= 11.5.1)
        run: npm install -g npm@latest

      - name: Check npm version after upgrade
        run: npm -v

      # 3) Publish via Trusted Publisher
      # IMPORTANT:
      #   - No NPM_TOKEN / NODE_AUTH_TOKEN
      #   - No `npm config set ...:_authToken`
      - name: Publish to npm via Trusted Publishing
        run: npm publish --provenance --access public --tag ${{ inputs.npm-tag }}