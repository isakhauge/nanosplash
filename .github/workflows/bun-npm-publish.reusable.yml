name: Reusable - Bun NPM Publish (Trusted Publisher)

on:
  workflow_call:
    inputs:
      working-directory:
        description: "Directory of the package"
        required: false
        type: string
        default: "."

jobs:
  publish:
    runs-on: ubuntu-latest

    # Required for npm Trusted Publishing (OIDC)
    permissions:
      id-token: write
      contents: read

    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # 1) Use Bun for install & build
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build package
        run: bun run build

      # 2) Use Node 24 + newest npm *just* for publication
      - name: Setup Node for publish
        uses: actions/setup-node@v6
        with:
          node-version: "24.x"
          registry-url: "https://registry.npmjs.org"
      - run: npm publish