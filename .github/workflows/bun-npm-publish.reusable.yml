# .github/workflows/reusables/bun-npm-publish.yml
name: Reusable - Bun NPM Publish (Trusted Publisher)

on:
  workflow_call:
    inputs:
      working-directory:
        description: "Directory of the package"
        required: false
        type: string
        default: "."
      # Optional: override tag (e.g. "next", "beta")
      npm-tag:
        description: "npm dist-tag to publish with"
        required: false
        type: string
        default: "latest"

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      id-token: write   # required for OpenID Connect
      contents: read

    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build package
        run: bun run build

      - name: Configure npm for OIDC
        run: |
          npm config set //registry.npmjs.org/:_authToken "env://NPM_TOKEN"

      - name: Publish to npm
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }} # will be provided by npm Trusted Publisher
        run: |
          # If your package.json has "publishConfig", you can just do:
          bunx npm publish --provenance --access public --tag ${{ inputs.npm-tag }}